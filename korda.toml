[General]
Mode = "development"

[Logging]
Level = "debug"

[Database]
Path = "./korda.db"

[Redis]
Addresses = ["127.0.0.1:6379"]
Database = 4

[Web]
BindIP             = "0.0.0.0"
Port               = 2284
BodyLimit          = 10737418240
RequestTimeout     = 30
Concurrency        = 262144
ProxyHeader        = "" # "X-Forwarded-For"
EnableIPValidation = false
TrustProxy         = false
TrustLoopback      = true
TrustProxies       = []
# Behind a reverse proxy on this machine, see the README:
# BindIP             = "127.0.0.1"
# ProxyHeader        = "X-Forwarded-For"
# EnableIPValidation = true
# TrustProxy         = true
# TrustLoopback      = true
# TrustProxies       = [] # only the proxy's own address when it runs elsewhere
ReduceMemoryUsage  = false
ServerHeader       = ""

[API]
RateLimitAuth = 10 # logins per minute and client address, for accounts and shared links each, 0 disables
CORSOrigins   = [] # browser origins that may call the API; empty means no CORS headers

[[Target]]
ID   = "jobs"
Type = "handler"

[Media]
Location         = "./media"
Concurrency      = 1
ThumbnailSize    = 250
ThumbnailQuality = 80

[Server]
ExternalDomain   = ""
LoginPageMessage = ""
PublicUsers      = true
TrashDays        = 30
UserDeleteDelay  = 7

# Nightly copy of the database into backups/ in the media folder, see the
# README. CronExpression is in the server's local time.
[Backup]
Enabled        = true
CronExpression = "0 02 * * *"
KeepLastAmount = 14
